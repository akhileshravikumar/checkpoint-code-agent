<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkpoint</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d;
          --fg:#e6edf3; --dim:#8b949e; --add:#2ea043; --del:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { padding:14px 20px; border-bottom:1px solid var(--line);
           display:flex; gap:14px; align-items:center; }
  h1 { font-size:15px; margin:0; letter-spacing:.02em }
  .pill { font-size:11px; color:var(--dim); border:1px solid var(--line);
          padding:2px 8px; border-radius:999px }
  main { max-width:1000px; margin:0 auto; padding:20px }
  .row { display:flex; gap:8px; margin-bottom:20px }
  input { flex:1; background:var(--panel); border:1px solid var(--line);
          color:var(--fg); padding:10px 12px; border-radius:6px; font:inherit }
  button { background:var(--panel); border:1px solid var(--line); color:var(--fg);
           padding:10px 16px; border-radius:6px; cursor:pointer; font:inherit }
  button:hover:not(:disabled) { border-color:var(--acc) }
  button:disabled { opacity:.4; cursor:not-allowed }
  #approve { border-color:var(--add) } #reject { border-color:var(--del) }
  .card { background:var(--panel); border:1px solid var(--line);
          border-radius:6px; padding:14px; margin-bottom:14px }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em;
             color:var(--dim); margin:0 0 10px }
  pre { margin:0; overflow-x:auto; font-size:12.5px; line-height:1.5 }
  .diff span { display:block; padding:0 6px }
  .diff .a { background:rgba(46,160,67,.15); color:#7ee787 }
  .diff .d { background:rgba(248,81,73,.15); color:#ffa198 }
  .diff .h { color:var(--acc) }
  .log div { padding:3px 0; color:var(--dim) }
  #gate { display:none; gap:8px } #gate.on { display:flex }
  #retry { border-color:#d29922; color:#d29922; margin-bottom:10px }
  #nochange-card { border-style:dashed } #nochange { color:var(--dim) }
</style>
</head>
<body>
<header>
  <h1>Checkpoint</h1>
  <span class="pill" id="thread">connecting…</span>
  <span class="pill" id="state">idle</span>
</header>
<main>
  <div class="row">
    <input id="task" placeholder="add input validation to search.py" autofocus>
    <button id="go">Run</button>
  </div>
  <div class="card"><h2>Activity</h2>
    <!-- not inside .row: its display:flex would override [hidden] -->
    <button id="retry" hidden>Retry step</button>
    <div class="log" id="log"></div>
  </div>
  <div class="card" id="nochange-card" hidden><h2>No change proposed</h2><div id="nochange"></div></div>
  <div class="card" id="plan-card" hidden><h2>Plan</h2><div id="plan"></div></div>
  <div class="card" id="diff-card" hidden>
    <h2>Proposed diff <span id="stats"></span></h2>
    <pre class="diff" id="diff"></pre>
    <div class="row" id="gate" style="margin-top:14px">
      <button id="approve">Approve</button>
      <button id="reject">Reject</button>
      <input id="note" placeholder="edit request…">
      <button id="edit">Request edit</button>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const KEY = 'checkpoint_thread';
const prior = new URLSearchParams(location.search).get('thread_id')
           || localStorage.getItem(KEY) || '';
const ws = new WebSocket(
  `ws://${location.host}/ws` + (prior ? `?thread_id=${encodeURIComponent(prior)}` : ''));
const log = m => { const d = document.createElement('div');
                   d.textContent = `${new Date().toLocaleTimeString()}  ${m}`;
                   $('log').prepend(d); };

const renderDiff = text => {
  $('diff').innerHTML = '';
  for (const line of text.split('\n')) {
    const el = document.createElement('span');
    el.textContent = line;
    if (line.startsWith('+') && !line.startsWith('+++')) el.className = 'a';
    else if (line.startsWith('-') && !line.startsWith('---')) el.className = 'd';
    else if (line.startsWith('@@')) el.className = 'h';
    $('diff').appendChild(el);
  }
};

ws.onopen = () => log('connected');
ws.onclose = () => { $('state').textContent = 'disconnected'; log('connection closed'); };

const showRetry = on => { $('retry').hidden = !on; };

// textContent, not innerHTML: the plan is model output.
const renderPlan = plan => {
  const box = $('plan'); box.innerHTML = '';
  const b = document.createElement('b'); b.textContent = plan.summary; box.appendChild(b);
  const ol = document.createElement('ol');
  for (const step of plan.steps) {
    const li = document.createElement('li'); li.textContent = step; ol.appendChild(li);
  }
  box.appendChild(ol);
  $('plan-card').hidden = false;
};

ws.onmessage = e => {
  const m = JSON.parse(e.data);
  // Any progress after an error means that error is no longer current. Also
  // right on reconnect, when the server replays the history in order.
  if (m.type !== 'error' && m.type !== 'session') showRetry(false);
  switch (m.type) {
    case 'session':
        $('thread').textContent = m.thread_id;
        localStorage.setItem(KEY, m.thread_id);
        history.replaceState(null, '', `?thread_id=${m.thread_id}`);
        break;
    case 'status':
      $('state').textContent = m.message; log(m.message); break;
    case 'diff_proposed':
      $('state').textContent = 'awaiting approval';
      $('nochange-card').hidden = true;
      renderPlan(m.plan);
      $('diff-card').hidden = false;
      $('stats').textContent = `+${m.stats.additions} −${m.stats.deletions}`;
      if (m.retry_count > 0) log(`⟳ attempt ${m.retry_count + 1} — re-planned from CI failure`);
      renderDiff(m.diff);
      $('gate').classList.add('on');
      log('diff proposed — waiting for you');
      break;
    case 'execution_result':
      $('state').textContent = m.approval_status;
      $('gate').classList.remove('on');
      log(`finished: ${m.approval_status}` + (m.pr_url ? ` → ${m.pr_url}` : ''));
      localStorage.removeItem(KEY);
      break;
    case 'no_change':
      // Not an error: the model found nothing to do. Nothing was applied.
      $('state').textContent = 'no change';
      $('gate').classList.remove('on');
      $('diff-card').hidden = true;
      $('nochange').textContent = m.message;
      $('nochange-card').hidden = false;
      if (m.plan) renderPlan(m.plan);
      log('no change proposed — nothing applied');
      localStorage.removeItem(KEY);
      break;
    case 'error':
      $('state').textContent = 'error';
      log(`ERROR: ${m.message}`);
      showRetry(!!m.resumable);    // a node crashed; its input is checkpointed
      break;
  }
};

$('go').onclick = () => {
  $('nochange-card').hidden = true;
  ws.send(JSON.stringify({ type: 'start', task: $('task').value }));
  $('state').textContent = 'planning…';
};
const decide = (decision, note = '') => {
  ws.send(JSON.stringify({ type: 'approval', decision, note }));
  $('gate').classList.remove('on');
};
$('retry').onclick = () => {
  showRetry(false);
  $('state').textContent = 'retrying…';
  log('retrying the step that failed');
  ws.send(JSON.stringify({ type: 'resume' }));
};
$('approve').onclick = () => decide('approved');
$('reject').onclick  = () => decide('rejected');
$('edit').onclick    = () => decide('edit_requested', $('note').value);
</script>
</body>
</html>
